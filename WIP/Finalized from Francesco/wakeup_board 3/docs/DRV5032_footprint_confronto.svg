<text x="30" y="44" class="h1">U_MAG_WAKE — perche il footprint e sbagliato</text>
<text x="30" y="68" class="h2">DRV5032FCQDBZR, package SOT-23 (DBZ). Tutti e tre i pannelli sono nella stessa scala: un quadretto della griglia = 1 mm. Il mirino rosso e l'origine del footprint.</text>
<text x="30" y="88" class="h2">Il confronto decisivo e col terzo pannello: e un SOT-23 della STESSA board, disegnato correttamente.</text>
