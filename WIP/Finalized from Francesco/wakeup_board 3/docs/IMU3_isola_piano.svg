<text x="941" y="130" class="lgt">LEGENDA</text>
<rect x="941" y="146" width="26" height="16" rx="2" fill="#c2453a" stroke="#8e2f27" stroke-width="1.6"/>
<text x="977" y="158" class="lg">pad e tracce su F.Cu (lato IMU)</text>
<rect x="941" y="172" width="26" height="16" rx="2" fill="#cfe3f5" stroke="#0b5d8f" stroke-width="1.6"/>
<text x="977" y="184" class="lg">condensatori su B.Cu (sotto)</text>
<rect x="941" y="198" width="26" height="16" rx="2" fill="#ffffff" stroke="#a34700" stroke-width="1.6"/>
<text x="977" y="210" class="lg">via a 3V3  (In6 / In11)</text>
<rect x="941" y="224" width="26" height="16" rx="2" fill="#ffffff" stroke="#1c3f94" stroke-width="1.6"/>
<text x="977" y="236" class="lg">via a FLEX_GND  (In1/4/7/10/12)</text>
<rect x="941" y="250" width="26" height="16" rx="2" fill="#eaf5f1" stroke="#0e7c66" stroke-width="1.6"/>
<text x="977" y="262" class="lg">keepout F.Cu</text>
<text x="941" y="314" class="lgt">PERCHE' COSI'</text>
<text x="941" y="332" class="nt"></text>
<text x="941" y="350" class="nt">Le quattro via di alimentazione stanno tutte</text>
<text x="941" y="368" class="nt">appena fuori dal perimetro del componente,</text>
<text x="941" y="386" class="nt">a 0.50 mm dal bordo del pad. Identiche fra loro:</text>
<text x="941" y="404" class="nt">la simmetria serve all'autoallineamento in reflow</text>
<text x="941" y="422" class="nt">(TN0018 3.8), non e' estetica.</text>
<text x="941" y="440" class="nt"></text>
<text x="941" y="458" class="nt">I condensatori sono sul BOTTOM, dove il rame</text>
<text x="941" y="476" class="nt">sotto il MEMS e' ammesso (3.10). Ognuno ha un</text>
<text x="941" y="494" class="nt">pad che cade sulla via: loop pin-condensatore</text>
<text x="941" y="512" class="nt">sotto il millimetro, contro i 9-10 mm di adesso.</text>
<text x="941" y="530" class="nt"></text>
<text x="941" y="548" class="nt">Dentro il keepout non passa niente: ne' tracce</text>
<text x="941" y="566" class="nt">ne' via (3.9). E' il vincolo meccanico, non</text>
<text x="941" y="584" class="nt">elettrico: rame sotto il sensore irrigidisce la</text>
<text x="941" y="602" class="nt">zona e la flessione della board si legge come</text>
<text x="941" y="620" class="nt">deriva dello zero-g.</text>
<text x="941" y="638" class="nt"></text>
<text x="941" y="656" class="nt">I pad sono disegnati alla misura raccomandata</text>
<text x="941" y="674" class="nt">0.575 x 0.35 = pad LGA + 0.1 mm (3.7), che e'</text>
<text x="941" y="692" class="nt">la correzione ancora da applicare.</text>
<text x="941" y="710" class="nt"></text>
<text x="941" y="728" class="nt">I pin 10 e 11 restano non connessi, come dice</text>
<text x="941" y="746" class="nt">il datasheet. I pin 6 e 7 vanno saldati comunque:</text>
<text x="941" y="764" class="nt">servono da appoggio meccanico.</text>
<text x="45" y="930" class="nt">Verificato: nessun conflitto con i componenti gia' presenti sul bottom, e tutte e sei le via sono libere. Raggio dal centro board 11-12 mm, ben dentro il bordo.</text>
</svg>