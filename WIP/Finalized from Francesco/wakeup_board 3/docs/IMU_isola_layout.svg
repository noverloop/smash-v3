<text x="30" y="46" class="h1">L'isola attorno all'IMU — ISM330DHCX LGA-14</text>
<text x="30" y="72" class="h2">Regole da TN0018 Rev 8 (ST, marzo 2025), sezioni 3.7-3.11. Scala: 1 mm = 105 px. Il corpo del componente e 3.0 x 2.5 mm.</text>
<text x="30" y="92" class="h2">La nota cita esplicitamente i pin 6, 7 e 8 dell'LGA-14: e lo stesso package che abbiamo qui.</text>
