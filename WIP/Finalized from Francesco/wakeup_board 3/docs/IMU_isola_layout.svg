<text x="466" y="279" class="pl" text-anchor="start">9 INT2</text>
<rect x="407.2" y="210.6" width="49.9" height="26.2" rx="1.5" fill="#c2453a" stroke="#8e2f27" stroke-width="1"/>
<text x="466" y="227" class="pl" text-anchor="start">10 nc</text>
<rect x="407.2" y="158.1" width="49.9" height="26.2" rx="1.5" fill="#c2453a" stroke="#8e2f27" stroke-width="1"/>
<text x="466" y="174" class="pl" text-anchor="start">11 nc</text>
<rect x="349.4" y="129.3" width="26.2" height="49.9" rx="1.5" fill="#c2453a" stroke="#8e2f27" stroke-width="1"/>
<text x="362" y="142" class="pl" text-anchor="middle">12 CS</text>
<rect x="296.9" y="129.3" width="26.2" height="49.9" rx="1.5" fill="#c2453a" stroke="#8e2f27" stroke-width="1"/>
<text x="310" y="142" class="pl" text-anchor="middle">13 SCL</text>
<rect x="244.4" y="129.3" width="26.2" height="49.9" rx="1.5" fill="#c2453a" stroke="#8e2f27" stroke-width="1"/>
<text x="258" y="142" class="pl" text-anchor="middle">14 SDA</text>
<text x="26" y="470" class="ok">tracce che escono RADIALI e SIMMETRICHE dal pad</text>
<text x="26" y="490" class="ok">via tutte FUORI dal corpo del componente</text>
<text x="26" y="510" class="ok">pin 6 e 7 (GND) saldati: se non lo sono,</text>
<text x="26" y="530" class="ok">   stressano meccanicamente il sensore</text>
<text x="26" y="550" class="ok">GND collegato con una TRACCIA, non attaccando</text>
<text x="26" y="570" class="ok">   il pad direttamente al piano</text>
</g>
