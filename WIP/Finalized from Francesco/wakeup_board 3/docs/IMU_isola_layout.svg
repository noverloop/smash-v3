<text x="26" y="470" class="bad">via sotto i pad — vanno spostate fuori</text>
<text x="26" y="490" class="bad">traccia di rame che passa sotto il corpo</text>
<text x="26" y="510" class="nt">   (quella del pin 8 deve uscire subito)</text>
<text x="26" y="530" class="bad">pin 6 e 7 non saldati</text>
<text x="26" y="550" class="nt"></text>
<text x="26" y="570" class="nt">ST: questi tre errori insieme davano deriva</text>
<text x="26" y="590" class="nt">   dello zero-g e dello zero-rate sul campo</text>
</g>
<g transform="translate(1314,120)">
<rect x="0" y="0" width="620" height="620" rx="8" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
<text x="310.0" y="30" class="pt" text-anchor="middle" fill="#1c3f94">SEZIONE</text>
<text x="310.0" y="50" class="ps" text-anchor="middle">perche top e bottom hanno regole diverse</text>
<rect x="70.0" y="190" width="480" height="150" fill="#f4f2ed" stroke="#1a1a1a" stroke-width="2"/>
<text x="558.0" y="265.0" class="nt">PCB</text>
<rect x="180.0" y="130" width="260" height="58" fill="#dfe8f7" stroke="#1c3f94" stroke-width="2"/>
<text x="310.0" y="164" class="pl" text-anchor="middle" fill="#1c3f94">MEMS</text>
<rect x="194.0" y="182" width="32" height="10" fill="#c2453a"/>
<rect x="254.0" y="182" width="32" height="10" fill="#c2453a"/>
<rect x="334.0" y="182" width="32" height="10" fill="#c2453a"/>
<rect x="394.0" y="182" width="32" height="10" fill="#c2453a"/>
<path d="M180.0,204 L440.0,204" stroke="#0e7c66" stroke-width="2.4" stroke-dasharray="7 5"/>
<text x="450.0" y="208" class="ok">niente rame ne via qui sotto (F.Cu)</text>
<path d="M110.0,322 L510.0,322" stroke="#1c3f94" stroke-width="5"/>
<text x="110.0" y="358" class="okb">B.Cu: piano e routing SOTTO il componente sono AMMESSI</text>
<text x="110.0" y="378" class="nt">(vale per accelerometri, giroscopi e sensori di pressione)</text>
<text x="26" y="440" class="nt">Il vincolo del top non e elettrico: e meccanico.</text>
<text x="26" y="460" class="nt">Rame e via sotto il componente irrigidiscono</text>
<text x="26" y="480" class="nt">la zona in modo asimmetrico, e la flessione</text>
<text x="26" y="500" class="nt">della board arriva alla struttura MEMS come</text>
<text x="26" y="520" class="nt">stress — che si legge come offset.</text>
<text x="26" y="540" class="nt"></text>
<text x="26" y="560" class="nt">Sul bottom il rame e separato dal componente</text>
<text x="26" y="580" class="nt">da tutto lo spessore della scheda, quindi non</text>
<text x="26" y="600" class="nt">trasferisce stress: li puoi passare.</text>
<text x="26" y="620" class="nt"></text>
<text x="26" y="640" class="nt">Su questa board vuol dire: i condensatori di</text>
<text x="26" y="660" class="nt">decoupling sul B.Cu sotto l'IMU sono OK,</text>
<text x="26" y="680" class="nt">le via che li collegano devono stare fuori</text>
<text x="26" y="700" class="nt">dal perimetro del componente.</text>
</g>
<rect x="30" y="764" width="1904" height="176" rx="8" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
<text x="54" y="794" class="pt">LE REGOLE, COI NUMERI DELL'ISM330DHCX</text>
<text x="54" y="820" class="rk">Land del PCB</text>
<text x="230" y="820" class="nt">pad LGA + 0.1 mm per lato (spaziatura pad LGA 250 um > 200 um)</text>
<text x="1330" y="820" class="rv">0.475 x 0.25  ->  0.575 x 0.35</text>
<text x="1700" y="820" class="src">TN0018 3.7</text>
<text x="54" y="837" class="rk">Apertura solder mask</text>
<text x="230" y="837" class="nt">land + 0.1 mm, cioe NSMD: la maschera sta FUORI dal land</text>
<text x="1330" y="837" class="rv">0.675 x 0.45</text>
<text x="1700" y="837" class="src">TN0018 3.7</text>
<text x="54" y="854" class="rk">Tutti i land uguali</text>
<text x="230" y="854" class="nt">nessun land grande, nessuna piazzola termica</text>
<text x="1330" y="854" class="rv">14 land identici</text>
<text x="1700" y="854" class="src">TN0018 3.7</text>
<text x="54" y="871" class="rk">Tracce</text>
<text x="230" y="871" class="nt">simmetriche, uguali su tutti i pad: aiutano l'autoallineamento in reflow</text>
<text x="1330" y="871" class="rv">0.10 mm su tutti i 14</text>
<text x="1700" y="871" class="src">TN0018 3.8</text>
<text x="54" y="888" class="rk">Massa</text>
<text x="230" y="888" class="nt">il piano NON va attaccato direttamente ai pad: passare da una traccia</text>
<text x="1330" y="888" class="rv">pad -> traccia -> via -> piano</text>
<text x="1700" y="888" class="src">TN0018 3.8</text>
<text x="54" y="905" class="rk">Sopra (F.Cu)</text>
<text x="230" y="905" class="nt">mai routing ne via sotto il componente: keepout</text>
<text x="1330" y="905" class="rv">3.0 x 2.5 mm + margine</text>
<text x="1700" y="905" class="src">TN0018 3.9</text>
<text x="54" y="922" class="rk">Sotto (B.Cu)</text>
<text x="230" y="922" class="nt">piano e routing sotto il componente sono ammessi</text>
<text x="1330" y="922" class="rv">decoupling qui: OK</text>
<text x="1700" y="922" class="src">TN0018 3.10</text>
</svg>